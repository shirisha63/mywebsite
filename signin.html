<!Doctype html>
  <html>
  <head>
  <title>Healthy bite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
      *{
            margin:0;
    padding:0;
    border-radius:10px;
    font-family:Arial;
  }
        body{
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;    
          background:url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=1400&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
        }
        .card{
          width:800px;
          display:flex;   
          border-radius:20px;
          overflow:hidden;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
        }
        .left,
  .right{
    width:50%;
    padding:50px;
  }
  .left{
    background:rgba(0,0,0,.3);
    color:white;
  }

    .left h1{
    font-size:45px;
    margin:20px 0;
  }
  .left p{
    line-height:1.6;
  }
      .icons{
      margin-top:25px;
  font-size:24px;
  display:flex;
  gap:20px;
  color:#b7ff65;}
  .right{
    background:white;
  }
  .right h2{
    font-size:35px;
  }
  .right p{
    color:gray;
    margin:10px 0 20px;
  }
  input{
    width:100%;
    padding:13px;
    margin:10px 0;

    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
  }
  button{
    width:100%;
    padding:13px;

    border:none;
    border-radius:10px;

    background:#6dbb2d;
    color:white;

    font-size:17px;
    cursor:pointer;
  }
  .social{
    text-align:center;
    margin-top:20px;
  }
  .social i{
    margin:10px;
    font-size:20px;
    
  }
  </style>
  <body>
  <div class=card>
  <div class=left>
  <h3>Healthy Bite</h3>
  <h1> Eat Healthy <br>Feel Better</h1>
  <p>Fresh Organic meals and healthy foods for your daily nutrition.</p>
  <div class="icons">
  <i class="fas fa-apple-whole"></i>
  <i class="fas fa-leaf"></i>
  <i class="fas fa-carrot"></i>
  </div>
  </div>
  <div class="right"> 
  <h2>login</h2>
  <p>continue your healthy journey</p>
  <input type="email" placeholder="email">
  <input type="password" placeholder="password">
  <button>sign in</button>
<a href="createaccount.html">Create an Account</a>
  <div class ="social"> 
  <p>Or login with</p>
  <i class="fab fa-google"></i>
  <i class="fab fa-facebook"></i>
  <i class ="fab fa-instagram"></i>
  </div>
  </div>
  </div>
 
  </body>
  </html>
