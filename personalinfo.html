<!DOCTYPE html>
<html>
<head>
<title>Personal Info</title>
<style>
body{
    font-family:Arial;
    
    background:#dfffe0;
}



.container{
    width:400px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h2{
    text-align:center;
    color:green;
}

input,select{
    width:90%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
   
    padding:10px 20px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    display:block;
   margin:20px auto;}
  
</style>
</head>

<body>

<div class="container">
    <h2>Personal Information</h2>

    <input type="text" placeholder="Full Name">

    <input type="email" placeholder="Email">

    <input type="tel" placeholder="Mobile Number">

    <select>
        <option>Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <input type="number" placeholder="Age">

    <input type="number" placeholder="Weight (kg)">

    <input type="number" placeholder="Height (cm)">

    <input type="text" placeholder="Diet Preference">

    <button>Save Details</button>
</div>

</body>
</html>
