<!DOCTYPE html>
<html>
<head>
<title>Healthy Bite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#00c853,#43a047,#1b5e20);
padding:20px;
}
.container{
width:900px;
background:white;
border-radius:20px;
overflow:hidden;
display:flex;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.left{
width:40%;
background:linear-gradient(180deg,#00e676,#00c853);
color:white;
padding:40px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}
.left i{font-size:90px;margin-bottom:20px}
.left h1{font-size:38px;margin-bottom:15px}
.left p{line-height:25px}
.right{width:60%;padding:40px}
.right h2{color:#1b5e20;margin-bottom:10px;font-size:32px}
.right p{color:gray;margin-bottom:20px}
.form-group{
display:flex;
gap:15px;
margin-bottom:15px;
}
input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
outline:none;
}
input:focus{
border-color:#00c853;
box-shadow:0 0 8px rgba(0,200,83,.4);
}
button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00c853,#43a047);
color:white;
font-size:18px;
cursor:pointer;
}
.bottom{
text-align:center;
margin-top:15px;
}
.bottom a{
color:#00c853;
text-decoration:none;
font-weight:bold;
}
@media(max-width:768px){
.container{flex-direction:column}
.left,.right{width:100%}
.form-group{flex-direction:column}
}
</style>
</head>
<body>
<div class="container">
<div class="left">
<i class="fa-solid fa-bowl-food"></i>
<h1>Healthy Bite</h1>
<p>Smart Food Recommender for healthy living and wellness tracking.</p>
</div>
<div class="right">
<h2>Create Account</h2>
<p>Start your healthy journey today.</p>
<form>
<div class="form-group">
<input type="text" placeholder="First Name">
<input type="text" placeholder="Last Name">
</div>
<div class="form-group">
<input type="email" placeholder="Email">
<input type="number" placeholder="Mobile Number">
</div>
<div class="form-group">
<input type="password" placeholder="Password">
<input type="password" placeholder="Confirm Password">
</div>
<div class="form-group">
<input type="number" placeholder="Weight (kg)">
<input type="number" placeholder="BP Rate (Optional)">
</div>
<div class="form-group">
<input type="number" placeholder="Sugar Rate (Optional)">
</div>
<button>
<i class="fa-solid fa-user-plus"></i>
Create Account
</button>
</form>
<div class="bottom">
Already have an account?
<a href="signin.html">Login</a> 
</div>
</div>
</div>

</body>
</html>
